spring.application.name=UptimeDesk
spring.profiles.default=dev

spring.jpa.open-in-view=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_JWT_ISSUER:}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWT_JWK_SET_URI:}

management.endpoints.web.exposure.include=health,info
server.port=8080

uptimedesk.alerts.email.enabled=${ALERT_EMAIL_ENABLED:false}
uptimedesk.alerts.email.from-address=${ALERT_EMAIL_FROM:noreply@uptimedesk.local}
uptimedesk.alerts.email.from-name=${ALERT_EMAIL_FROM_NAME:UptimeDesk}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:false}
