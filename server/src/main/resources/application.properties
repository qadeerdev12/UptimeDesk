spring.application.name=UptimeDesk

spring.datasource.url=jdbc:h2:mem:uptimedesk
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_JWT_ISSUER:}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWT_JWK_SET_URI:}

management.endpoints.web.exposure.include=health,info
server.port=8080
